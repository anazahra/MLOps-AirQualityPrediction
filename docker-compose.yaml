version: '3.8'

services:
  # Layanan 1: MLflow Tracking Server 
  mlflow-server:
    image: python:3.11-slim
    container_name: mlflow-server
    working_dir: /mlflow
    volumes:
      - mlflow-artifacts:/mlflow/mlruns
      - mlflow-db:/mlflow/db
      - ./mlruns:/mlflow/local-mlruns:ro
    ports:
      - '5000:5000'
    command: >
      bash -c "pip install mlflow --quiet &&
      mlflow server
      --backend-store-uri sqlite:///db/mlflow.db
      --default-artifact-root /mlflow/mlruns
      --host 0.0.0.0
      --port 5000"
    networks:
      - ml-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5000/health']
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # Layanan 2: API Inferensi 
  api-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-service
    ports:
      - '8000:8000'
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./src:/app/src
    depends_on:
      mlflow-server:
        condition: service_healthy
    networks:
      - ml-network
    restart: on-failure

# networks 
networks:
  ml-network:
    driver: bridge
    name: ml-network

# volumes
volumes:
  mlflow-artifacts:
    driver: local
  mlflow-db:
    driver: local
