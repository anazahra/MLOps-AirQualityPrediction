version: '3.8'

services:
  mlflow-server:
    image: python:3.11-slim
    container_name: mlflow-server
    working_dir: /mlflow
    volumes:
      - mlflow-artifacts:/mlflow/mlruns
      - mlflow-db:/mlflow/db
    ports:
      - '5000:5000'
    command:
      - bash
      - -c
      - |
        pip install mlflow --quiet &&
        mlflow server \
          --backend-store-uri sqlite:///db/mlflow.db \
          --default-artifact-root /mlflow/mlruns \
          --host 0.0.0.0 \
          --port 5000 \
          --allowed-hosts '*'
    networks:
      - ml-network

  api-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-service
    ports:
      - '8000:8000'
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./src:/app/src
    depends_on:
      - mlflow-server
    networks:
      - ml-network
    restart: on-failure

  aqi-model-server:
    image: aqi-model-server:latest
    ports:
      - '1234-1236:8080'
    networks:
      - ml-network
    restart: on-failure

networks:
  ml-network:
    driver: bridge
    name: ml-network

volumes:
  mlflow-artifacts:
    driver: local
  mlflow-db:
    driver: local
