name: MLOps Pipeline Automation

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ 'main' ]

jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependensi
        run: pip install -r requirements.txt

      - name: Jalankan unit test
        run: pytest tests/ -v
  
  training:
    runs-on: ubuntu-latest
    needs: testing        # Hanya jalan jika testing LULUS
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup DVC
        uses: iterative/setup-dvc@v1

      - name: Pull data terbaru via DVC
        run: |
          dvc pull 

      - name: Debug dataset
        run: |
          echo "=== CHECK DATA ==="
          find data -type f
          
      - name: Jalankan training model
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: python src/models/train.py

      - name: Simpan mlruns sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlruns-artifact-${{ github.run_number }}
          path: mlruns/
          retention-days: 7

  registry:
    runs-on: ubuntu-latest
    needs: training       # Hanya jalan jika training SELESAI
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download mlruns dari job training
        uses: actions/download-artifact@v4
        with:
          name: mlruns-artifact-${{ github.run_number }}
          path: mlruns/

      - name: Evaluasi dan promosi model
        run: python src/evaluate_and_promote.py