name: Continuous Training Pipeline

on:
  # Skenario C: Schedule-based -> setiap Minggu jam 08.00 WIB (01.00 UTC)
  schedule:
    - cron: '0 1 * * 0'

  # Manual trigger untuk testing dan simulasi
  workflow_dispatch:
    inputs:
      force_retrain:
        description: 'Force retraining tanpa cek trigger'
        required: false
        default: false
        type: boolean

  # Trigger saat ada push data baru (Skenario B)
  push:
    branches: [main, 'feat/**']
    paths:
      - 'data/raw/**.csv'
      - 'data/raw/**.dvc'
      - 'src/ct/**.py'

jobs:
  # ============================================
  # JOB 1: Evaluasi Trigger
  # ============================================
  evaluate-trigger:
    runs-on: ubuntu-latest
    outputs:
      should_retrain: ${{ steps.check.outputs.should_retrain }}

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc scipy

      - name: Pull dataset dari DVC
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc remote modify dagshub auth basic
          dvc remote modify dagshub user $DAGSHUB_USERNAME
          dvc remote modify dagshub password $DAGSHUB_TOKEN
          dvc pull

      - name: Evaluasi trigger (performance + drift)
        id: check
        run: |
          if [ "${{ inputs.force_retrain }}" == "true" ]; then
            echo "Force retrain aktif."
            echo "should_retrain=true" >> $GITHUB_OUTPUT
          else
            cd src/ct
            python ct_trigger.py
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 0 ]; then
              echo "should_retrain=true" >> $GITHUB_OUTPUT
            else
              echo "should_retrain=false" >> $GITHUB_OUTPUT
            fi
          fi
        continue-on-error: true

  # ============================================
  # JOB 2: Retraining (hanya jika trigger aktif)
  # ============================================
  continuous-training:
    runs-on: ubuntu-latest
    needs: evaluate-trigger
    if: needs.evaluate-trigger.outputs.should_retrain == 'true'

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc scipy

      - name: Pull dataset dari DVC
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc remote modify dagshub auth basic
          dvc remote modify dagshub user $DAGSHUB_USERNAME
          dvc remote modify dagshub password $DAGSHUB_TOKEN
          dvc pull

      - name: Jalankan retraining dan promosi
        run: |
          cd src/ct
          python retrain_and_promote.py

      - name: Simpan mlruns sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: ct-mlruns-${{ github.run_number }}
          path: mlruns/
          retention-days: 14