name: MLOps AQI Pipeline - CI/CD

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 1 * * *'   # 08.00 WIB setiap hari
  workflow_dispatch:       # Boleh trigger manual dari tab Actions

jobs:
  # ─── JOB 1: CI – Cek kualitas kode & data ──────────────
  ci-validation:
    name: 'CI – Lint, Test & Validate'
    runs-on: ubuntu-latest

    steps:
      - name: '1. Checkout kode terbaru'
        uses: actions/checkout@v4

      - name: '2. Setup Python 3.11'
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: '3. Install dependencies'
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: '4. Jalankan unit tests'
        run: |
          pytest tests/ -v --tb=short --ignore=tests/test_preprocessing_output.py
        continue-on-error: false

  # ─── JOB 2: CD – Pipeline data otomatis ────────────────
  cd-data-pipeline:
    name: 'CD – Data Ingestion & Preprocessing'
    needs: ci-validation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'

    env:
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}

    steps:
      - name: '1. Checkout kode'
        uses: actions/checkout@v4

      - name: '2. Setup Python 3.11'
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: '3. Install dependencies'
        run: pip install -r requirements.txt

      - name: '4. Jalankan data ingestion'
        run: python src/ingest_data.py

      - name: '5. Jalankan preprocessing'
        run: python src/preprocess.py

      - name: '6. Upload hasil sebagai artifact'
        uses: actions/upload-artifact@v4
        with:
          name: processed-data-${{ github.run_number }}
          path: data/processed/
          retention-days: 7
